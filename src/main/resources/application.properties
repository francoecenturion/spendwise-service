spring.application.name=spendwise-service

# Flyway: off by default, only enabled explicitly in application-prod.properties.
# Dev/test keep managing schema via ddl-auto instead.
spring.flyway.enabled=false

# Spring Security
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# JWT
jwt.expiration-ms=3600000
jwt.refresh-expiration-ms=7776000000


# Resend (local dev - poner API key real o dejar vacío para no enviar)
resend.api-key=${RESEND_API_KEY:re_test_placeholder}
