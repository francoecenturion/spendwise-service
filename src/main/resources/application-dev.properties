# ========================================
# = BASE CONFIG
# ========================================
spring.application.name=spendwise-service


# ========================================
# = DATA SOURCE
# ========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/spendwise
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
management.otlp.metrics.export.enabled=false

# ========================================
# = JPA / HIBERNATE
# ========================================
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=spendwise

# Flyway is disabled here (inherited from application.properties) — dev recreates
# the whole schema via ddl-auto=create on every restart, so migrations don't apply.

# ========================================
# = SQL INITIALIZATION
# ========================================
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:/schema-dev.sql
spring.sql.init.data-locations=classpath:/data-dev.sql
spring.jpa.defer-datasource-initialization=true

# ========================================
# = EXTERNAL APIS
# ========================================
external.dolarApi.base-url=https://dolarapi.com
external.dolarApiHistorical.base-url=https://argentinadatos.com/

# ========================================
# = JWT
# ========================================
jwt.secret=${JWT_SECRET}

# ========================================
# = RESEND EMAIL API
# ========================================
# Setear en Render: RESEND_API_KEY=re_xxxxxxxxxxxx
resend.api-key=${RESEND_API_KEY}
# Setear en Render: RESEND_FROM=SpendWise <noreply@tudominio.com>
# Sin dominio propio usar: SpendWise <onboarding@resend.dev>
resend.from=${RESEND_FROM:SpendWise <onboarding@resend.dev>}

# ========================================
# = APP
# ========================================
app.base-url=http://localhost:3000

# ========================================
# = ADMIN
# ========================================
admin.password=${ADMIN_PASSWORD:12345678}
admin.email=${ADMIN_EMAIL:admin@admin.com}
