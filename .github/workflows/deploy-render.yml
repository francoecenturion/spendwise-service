name: Deploy to Render

on:
  push:
    branches:
      - main

jobs:
  test-and-deploy:
    name: Test and deploy
    runs-on: ubuntu-latest
    # Run for merges from develop or release/* branches. GitHub merge commits
    # include the source branch in the commit message.
    # Squash merges need the source branch name in the squash title.
    if: >
      contains(github.event.head_commit.message, 'develop') ||
      contains(github.event.head_commit.message, 'release/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn -B test

      - name: Trigger Render deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
