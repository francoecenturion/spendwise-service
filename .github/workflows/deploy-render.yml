name: Deploy to Render

on:
  push:
    branches:
      - main
  pull_request_target:
    types: [closed]
    branches:
      - main

jobs:
  test-and-deploy:
    name: Test and deploy
    runs-on: ubuntu-latest
    # Pushes to main deploy after merges from develop or release/* branches.
    # A merged hotfix PR is handled by pull_request_target, which gives us the
    # source branch directly instead of relying on the merge commit message.
    if: >
      (github.event_name == 'push' &&
        (contains(github.event.head_commit.message, 'develop') ||
         contains(github.event.head_commit.message, 'release/'))) ||
      (github.event_name == 'pull_request_target' &&
        github.event.pull_request.merged == true &&
        startsWith(github.event.pull_request.head.ref, 'hotfix/'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn -B test

      - name: Trigger Render deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
