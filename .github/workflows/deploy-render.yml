name: Deploy to Render

on:
  push:
    branches:
      - main

jobs:
  test-and-deploy:
    name: Test and deploy
    runs-on: ubuntu-latest
    # Only deploy when this push to main is a merge from develop — either a
    # GitHub PR merge commit ("Merge pull request #N from OWNER/develop") or
    # a local merge commit ("Merge branch 'develop' [into main]"). Both
    # contain "develop" in the commit message. If you switch to squash
    # merging, GitHub's default squash commit message won't mention the
    # source branch, so this condition would need to change.
    if: contains(github.event.head_commit.message, 'develop')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn -B test

      - name: Trigger Render deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
