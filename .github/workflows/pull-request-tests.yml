name: Pull request tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  test-suite:
    name: Run test suite
    # Validate feature/* -> develop and release/* -> main pull requests.
    if: >
      (github.base_ref == 'develop' && startsWith(github.head_ref, 'feature/')) ||
      (github.base_ref == 'main' && startsWith(github.head_ref, 'release/'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run test suite
        run: mvn -B test
